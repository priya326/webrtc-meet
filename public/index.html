<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>MiniMeet</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <header>
        <h1>MiniMeet</h1>
        <p class="subtitle">A tiny WebRTC experiment</p>
      </header>
      <p class="subtitle">A WebRTC video calling experiment</p>

      <div class="video-grid">
        <div class="video-card">
          <h2>Local Video</h2>

          <div class="video-wrapper">
            <video id="localVideo" autoplay playsinline></video>
          </div>
        </div>

        <div class="video-card">
          <h2>Remote Video</h2>

          <div class="video-wrapper">
            <video id="remoteVideo" autoplay playsinline></video>
          </div>
        </div>
      </div>

      <div class="controls">
        <button id="startButton">Start Camera</button>
      </div>
      <div class="room-controls">
        <input id="roomInput" type="text" placeholder="Enter room ID" />

        <button id="joinButton">Join Room</button>
      </div>

      <div class="status">WebRTC • STUN • ICE • WebSocket Signaling</div>
    </div>
    <script>
      const localVideo = document.getElementById("localVideo");
      const startButton = document.getElementById("startButton");
      const remoteVideo = document.getElementById("remoteVideo");
      const joinButton = document.getElementById("joinButton");
      const roomInput = document.getElementById("roomInput");

      const socket = new WebSocket("wss://webrtc-meet-oyyj.onrender.com");

      let peerConnection = null;
      let localStream = null;
      let pendingCandidates = [];

      let roomId = null;
      let joinedRoom = false;
      let peerReady = false;
      let makingOffer = false;

      function createPeerConnection() {
        peerConnection = new RTCPeerConnection({
          iceServers: [
            {
              urls: "stun:stun.l.google.com:19302",
            },
          ],
        });

        peerConnection.onconnectionstatechange = () => {
          console.log("Connection state:", peerConnection.connectionState);
        };

        peerConnection.oniceconnectionstatechange = () => {
          console.log("ICE state:", peerConnection.iceConnectionState);
        };

        peerConnection.ontrack = async (event) => {
          console.log("Received remote track!");

          remoteVideo.srcObject = event.streams[0];

          try {
            await remoteVideo.play();
          } catch (error) {
            console.log("Remote video play failed:", error);
          }
        };

        peerConnection.onicecandidate = (event) => {
          if (!event.candidate) {
            return;
          }

          socket.send(
            JSON.stringify({
              type: "ice-candidate",
              candidate: event.candidate,
            })
          );
        };
      }

      createPeerConnection();

      async function maybeStartCall() {
        if (!peerReady) {
          console.log("Waiting for peer...");
          return;
        }

        if (!localStream) {
          console.log("Waiting for camera...");
          return;
        }

        if (makingOffer) {
          return;
        }

        makingOffer = true;

        try {
          console.log("Starting call...");

          const offer = await peerConnection.createOffer();

          await peerConnection.setLocalDescription(offer);

          socket.send(
            JSON.stringify({
              type: "offer",
              offer: peerConnection.localDescription,
            })
          );

          console.log("Offer sent");
        } catch (error) {
          console.error("Error creating offer:", error);
        } finally {
          makingOffer = false;
        }
      }

      socket.onopen = () => {
        console.log("Connected to signaling server");

        socket.send(
          JSON.stringify({
            type: "hello",
            message: "Hello from this browser!",
          })
        );
      };

      joinButton.addEventListener("click", () => {
        const room = roomInput.value.trim();

        if (!room) {
          alert("Please enter a room ID");
          return;
        }

        // Prevent joining again with the same WebSocket
        if (joinedRoom) {
          alert(`You are already in room "${roomId}"`);
          return;
        }

        if (socket.readyState !== WebSocket.OPEN) {
          alert("Not connected to signaling server yet.");
          return;
        }

        socket.send(
          JSON.stringify({
            type: "join",
            room: room,
          })
        );
      });

      socket.onmessage = async (message) => {
        const data = JSON.parse(message.data);

        // -------------------------
        // Successfully joined
        // -------------------------
        if (data.type === "joined") {
          roomId = data.room;
          joinedRoom = true;

          roomInput.disabled = true;
          joinButton.disabled = true;

          console.log("Joined room:", roomId);

          return;
        }

        // -------------------------
        // Server error
        // -------------------------
        if (data.type === "error") {
          alert(data.message);
          return;
        }
        //peer left the room
        if (data.type === "peer-left") {
          console.log("Peer left the room");

          peerReady = false;

          if (peerConnection) {
            peerConnection.close();
          }

          peerConnection = null;

          remoteVideo.srcObject = null;

          pendingCandidates = [];

          createPeerConnection();
          if (localStream) {
            localStream.getTracks().forEach((track) => {
              peerConnection.addTrack(track, localStream);
            });
          }
          return;
        }
        // -------------------------
        // Another peer joined
        // -------------------------
        if (data.type === "peer-joined") {
          console.log("A peer joined the room");

          peerReady = true;

          // If camera is already on, start immediately.
          // If camera is not on yet, maybeStartCall()
          // will run again when the camera is started.
          await maybeStartCall();

          return;
        }

        // -------------------------
        // Received offer
        // -------------------------
        if (data.type === "offer") {
          console.log("Received offer");

          await peerConnection.setRemoteDescription(data.offer);

          console.log("Set remote description");

          // Add ICE candidates that arrived before the offer
          for (const candidate of pendingCandidates) {
            await peerConnection.addIceCandidate(candidate);
          }

          pendingCandidates = [];

          const answer = await peerConnection.createAnswer();

          await peerConnection.setLocalDescription(answer);

          socket.send(
            JSON.stringify({
              type: "answer",
              answer: peerConnection.localDescription,
            })
          );

          console.log("Answer sent");

          return;
        }

        // -------------------------
        // Received answer
        // -------------------------
        if (data.type === "answer") {
          console.log("Received answer");

          await peerConnection.setRemoteDescription(data.answer);

          console.log("Set remote description from answer");

          return;
        }

        // -------------------------
        // Received ICE candidate
        // -------------------------
        if (data.type === "ice-candidate") {
          if (!peerConnection.remoteDescription) {
            console.log(
              "Remote description isn't ready. Saving ICE candidate."
            );

            pendingCandidates.push(data.candidate);
            return;
          }

          await peerConnection.addIceCandidate(data.candidate);

          console.log("Added remote ICE candidate");

          return;
        }
      };

      // -------------------------
      // Start camera
      // -------------------------
      startButton.addEventListener("click", async () => {
        try {
          if (localStream) {
            console.log("Camera is already running");
            return;
          }

          localStream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: true,
          });

          localVideo.srcObject = localStream;

          localStream.getTracks().forEach((track) => {
            peerConnection.addTrack(track, localStream);
          });

          startButton.disabled = true;

          console.log("Camera added to PeerConnection");

          // Important:
          // This allows BOTH orders:
          //
          // Camera → Join
          //
          // OR
          //
          // Join → Camera
          //
          await maybeStartCall();
        } catch (error) {
          console.error("Could not access camera:", error);
          alert("Could not access camera or microphone.");
        }
      });
    </script>
  </body>
</html>
